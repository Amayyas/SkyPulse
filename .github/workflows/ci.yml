name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  verify:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Mockito mocks are git-ignored, so a fresh checkout has no *.mocks.dart
      # and `flutter test` cannot compile without this step.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # Strict: any analyzer issue, down to an info, fails the build.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            command: flutter build apk --debug
          - target: web
            os: ubuntu-latest
            command: flutter build web
          - target: linux
            os: ubuntu-latest
            command: flutter build linux
          - target: ios
            os: macos-latest
            command: flutter build ios --no-codesign --debug
          - target: macos
            os: macos-latest
            command: flutter build macos --debug
          - target: windows
            os: windows-latest
            command: flutter build windows --debug

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # The API key is still a placeholder constant in lib/utils/constants.dart,
      # so no secret is needed to build. Once #26 lands and the key moves to
      # String.fromEnvironment, add:
      #   --dart-define=OWM_API_KEY=${{ secrets.OWM_API_KEY }}
      - name: Build
        run: ${{ matrix.command }}
