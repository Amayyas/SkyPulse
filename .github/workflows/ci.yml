name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue re-tests each pull request against the tip of main before it
  # lands. Without this trigger the required checks would never report on a queue
  # entry, and queued pull requests would hang forever.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request makes the in-flight run obsolete. A merge
  # queue run must never be cancelled: the queue is waiting on its result, and
  # cancelling it would eject the pull request.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  verify:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Mockito mocks are git-ignored, so a fresh checkout has no *.mocks.dart
      # and `flutter test` cannot compile without this step.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # --no-fatal-infos is a temporary concession: 12 deprecation infos are
      # outstanding (#13). Drop the flag once they are fixed, so that infos
      # fail the build like everything else.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            command: flutter build apk --debug
          - target: web
            os: ubuntu-latest
            command: flutter build web
          - target: linux
            os: ubuntu-latest
            command: flutter build linux
          - target: ios
            os: macos-latest
            command: flutter build ios --no-codesign --debug
          - target: macos
            os: macos-latest
            command: flutter build macos --debug
          - target: windows
            os: windows-latest
            command: flutter build windows --debug

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # The API key is still a placeholder constant in lib/utils/constants.dart,
      # so no secret is needed to build. Once #26 lands and the key moves to
      # String.fromEnvironment, add:
      #   --dart-define=OWM_API_KEY=${{ secrets.OWM_API_KEY }}
      - name: Build
        run: ${{ matrix.command }}
