name: release-please

# Maintains a "release PR" that bumps the version and updates CHANGELOG.md from
# Conventional Commits. Merging that PR creates the git tag and the GitHub
# Release. Nothing is released until the release PR is merged.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Uses release-please-config.json + .release-please-manifest.json.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build and attach the downloadable artifacts for the release just created.
  # Called explicitly rather than via `release: published`: GitHub does not emit
  # trigger events for actions taken with the default GITHUB_TOKEN, so that
  # trigger would never fire here.
  artifacts:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    # Mapped explicitly rather than `secrets: inherit`: the called workflow
    # needs this one key, not every secret the repo holds. github.token is
    # available to reusable workflows without being passed.
    secrets:
      OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
