version: 2
updates:
  # Dart / Flutter packages. `flutter pub outdated` currently reports a large
  # backlog, and a stale codegen chain is what broke build_runner entirely (#29).
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"

  # The CI workflow's actions rot too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
