version: 2
updates:
  # Dart / Flutter packages. `flutter pub outdated` currently reports a large
  # backlog, and a stale codegen chain is what broke build_runner entirely (#29).
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"

  # The CI workflow's actions rot too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Kotlin 2.4 turns AGP 9's DSL deprecations into hard script-compilation
      # errors, and android/app/build.gradle.kts still uses the old DSL. Any
      # Kotlin bump therefore fails the Android build. Remove this ignore once
      # the Gradle config is migrated to the current Flutter template (#54).
      - dependency-name: "org.jetbrains.kotlin.android"
